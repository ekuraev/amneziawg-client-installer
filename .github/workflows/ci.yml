name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    name: shellcheck + юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install-awg-client.sh tests/*.sh
      - name: bash -n
        run: bash -n install-awg-client.sh
      - name: юнит-тесты
        run: bash tests/test_installer.sh
      - name: --version и --help
        run: |
          bash install-awg-client.sh --version
          bash install-awg-client.sh --help

  build-arm64:
    name: сборка модуля, tools и amneziawg-go (Debian arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: docker build test
        run: bash tests/docker-build-test.sh
